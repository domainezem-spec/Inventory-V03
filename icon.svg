<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: White with rounded corners matching the user image -->
  <rect width="512" height="512" rx="128" fill="#ffffff"/>
  
  <g transform="translate(66, 60)">
    <!-- EZEM Logo Grid/Lines -->
    <!-- E (Left part) -->
    <path d="M 60 70 L 160 70" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 60 70 L 60 210" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 60 210 L 160 210" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 60 140 L 120 140" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    
    <!-- Eyes under E -->
    <path d="M 90 170 L 130 170" stroke="#1d1107" stroke-width="16" stroke-linecap="square"/>
    <path d="M 90 170 L 90 185" stroke="#1d1107" stroke-width="16" stroke-linecap="square"/>
    
    <!-- Z (Middle part) -->
    <path d="M 190 70 L 290 70" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 290 70 L 190 210" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 190 210 L 290 210" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    
    <!-- E (Right part - reversed/flipped style) -->
    <path d="M 320 70 L 420 70" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 420 70 L 420 210" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 320 210 L 420 210" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    <path d="M 360 140 L 420 140" stroke="#1d1107" stroke-width="28" stroke-linecap="square"/>
    
    <!-- Eyes under Flipped E -->
    <path d="M 350 170 L 390 170" stroke="#1d1107" stroke-width="16" stroke-linecap="square"/>
    <path d="M 390 170 L 390 185" stroke="#1d1107" stroke-width="16" stroke-linecap="square"/>
    
    <!-- M (Bottom part) -->
    <path d="M 190 250 L 190 310" stroke="#1d1107" stroke-width="26" stroke-linecap="square"/>
    <path d="M 190 250 L 240 300" stroke="#1d1107" stroke-width="26" stroke-linecap="square"/>
    <path d="M 290 250 L 240 300" stroke="#1d1107" stroke-width="26" stroke-linecap="square"/>
    <path d="M 290 250 L 290 310" stroke="#1d1107" stroke-width="26" stroke-linecap="square"/>
  </g>
  
  <!-- Text: EZEM -->
  <text x="256" y="445" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="52" fill="#1d1107" text-anchor="middle" letter-spacing="2">EZEM</text>
</svg>
